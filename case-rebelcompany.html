        <section class="case-section" data-reveal>

            <h2 data-fr="Une agence qui a besoin de se réinventer" data-en="An agency that needed to reinvent itself"></h2>
            <p data-fr="RebelCompany est une agence de communication digitale qui accompagne des entrepreneurs dans la création de leur site web. Ma mission consistait à réaliser une refonte complète du site de l'agence elle-même, afin qu'il reflète mieux son savoir-faire."
               data-en="RebelCompany is a digital communication agency that helps entrepreneurs build their websites. My mission was to carry out a complete redesign of the agency's own site, so it would better reflect its expertise."
            ></p>
        </section>

        <section class="case-section" data-reveal>
            <span class="case-num">02 — <span data-fr="Problématique" data-en="Problem"></span></span>
            <h2 data-fr="Une image qui ne portait pas assez" data-en="An image that didn't carry enough weight"></h2>
            <p data-fr="Le site existant peinait à convaincre : il ne rendait pas justice au professionnalisme de l'agence, la navigation manquait de clarté, et l'expérience mobile n'était pas prioritaire alors qu'une grande partie des prospects visitent le site depuis leur téléphone."
               data-en="The existing site struggled to convince: it didn't do justice to the agency's professionalism, navigation lacked clarity, and mobile wasn't treated as a priority even though a large share of prospects browse from their phone."
            ></p>
        </section>

            <h2 data-fr="Ce que la refonte devait apporter" data-en="What the redesign needed to deliver"></h2>

                    <h3 data-fr="Moderniser l'image" data-en="Modernize the image"></h3>
                    <p data-fr="Une identité de marque plus affirmée." data-en="A stronger brand identity."></p>
                </div>
                <div class="case-card">
                    <h3 data-fr="Renforcer la crédibilité" data-en="Strengthen credibility"></h3>

                </div>
                <div class="case-card">
                    <h3 data-fr="Penser mobile-first" data-en="Think mobile-first"></h3>
                    <p data-fr="Une expérience pensée d'abord pour le mobile." data-en="An experience designed for mobile first."></p>
                </div>
                <div class="case-card">
                    <h3 data-fr="Améliorer la navigation" data-en="Improve navigation"></h3>
                    <p data-fr="Un parcours plus clair vers les offres." data-en="A clearer path towards the agency's offers."></p>
                </div>
                <div class="case-card">
                    <h3 data-fr="Augmenter les conversions" data-en="Increase conversions"></h3>
                    <p data-fr="Faciliter la prise de contact." data-en="Make it easier to get in touch."></p>
                </div>
                <div class="case-card">
                    <h3 data-fr="Faciliter l'intégration" data-en="Ease integration"></h3>
                    <p data-fr="Une maquette facilement intégrable par un développeur." data-en="A mockup easy for a developer to build."></p>
                </div>
            </div>
        </section>

        <section class="case-section" data-reveal>
            <span class="case-num">04 — <span data-fr="Démarche UX/UI" data-en="UX/UI process"></span></span>
            <h2 data-fr="Une approche mobile-first" data-en="A mobile-first approach"></h2>
            <p data-fr="J'ai débuté par une refonte de l'identité visuelle, pensée pour renforcer la crédibilité de l'agence auprès de ses prospects. L'architecture de l'information et les wireframes ont été construits mobile-first, avant d'aboutir à des prototypes interactifs haute fidélité, desktop et mobile, sur Figma."
               data-en="I started with a redesign of the visual identity, meant to strengthen the agency's credibility with prospects. Information architecture and wireframes were built mobile-first, leading to high-fidelity interactive prototypes, desktop and mobile, in Figma."
            ></p>
            <ul>
                <li data-fr="Refonte de l'identité de marque pour renforcer la crédibilité" data-en="Brand identity redesign to strengthen credibility"></li>
                <li data-fr="Architecture de l'information et wireframes mobile-first" data-en="Mobile-first information architecture and wireframes"></li>
                <li data-fr="Prototypes interactifs haute fidélité (desktop &amp; mobile) sur Figma" data-en="High-fidelity interactive prototypes (desktop &amp; mobile) in Figma"></li>
                <li data-fr="Maquette structurée pour faciliter une future intégration" data-en="Mockup structured to ease a future integration"></li>
            </ul>
            <div class="case-image-frame">
                <img src="./assets/images/rebelcompany/designSystem.png" alt="Design System RebelCompany">
